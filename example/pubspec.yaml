name: getpayin_checkout_example
description: Takes a payment with the hosted GetPayIn checkout.
publish_to: none
version: 1.0.0

environment:
  sdk: ^3.6.0
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter
  getpayin_checkout:
    path: ../
  # The harness asks its own dev server for a payment, the way an app asks its backend.
  http: ^1.2.0
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_lints: '>=5.0.0 <7.0.0'
  flutter_test:
    sdk: flutter

# The sheet draws Material icons, whose code points sit in the private use area. Without
# this the icon font is not bundled and every one of them renders as whatever the system
# falls back to, which on Android is a CJK glyph.
flutter:
  uses-material-design: true
