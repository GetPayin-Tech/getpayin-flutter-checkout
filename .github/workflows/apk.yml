name: apk

# Built on request rather than on every push: it is for the by-hand checks in
# CONTRIBUTING.md, which need a phone, not for the verify loop.
on:
  workflow_dispatch:
    inputs:
      payments_server:
        description: Where example/tool/dev_server.py is listening, as the phone reaches it
        required: false
        default: ''
      fields_page:
        description: The fields page, on the origin registered for your integration
        required: false
        default: ''
  push:
    tags: ['v*']

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # Debug rather than release: a release APK is unsigned and will not install, and this
      # is a harness for trying a real checkout on a real phone. The two addresses are built
      # in rather than typed on the phone, and rather than committed.
      - name: Build the example
        working-directory: example
        env:
          PAYMENTS_SERVER: ${{ inputs.payments_server }}
          FIELDS_PAGE: ${{ inputs.fields_page }}
        run: |
          defines=()
          if [ -n "$PAYMENTS_SERVER" ]; then
            defines+=("--dart-define=PAYMENTS_SERVER=$PAYMENTS_SERVER")
          fi
          if [ -n "$FIELDS_PAGE" ]; then
            defines+=("--dart-define=FIELDS_PAGE=$FIELDS_PAGE")
          fi
          flutter build apk --debug "${defines[@]}"

      - uses: actions/upload-artifact@v5
        with:
          name: getpayin-checkout-example-debug
          path: example/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
