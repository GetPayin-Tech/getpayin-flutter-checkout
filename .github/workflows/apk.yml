name: apk

# Built on request rather than on every push: it is for the by-hand checks in
# CONTRIBUTING.md, which need a phone, not for the verify loop.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # Debug rather than release: a release APK is unsigned and will not install, and this
      # is a harness for trying a real checkout on a real phone.
      - name: Build the example
        working-directory: example
        run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: getpayin-checkout-example-debug
          path: example/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
